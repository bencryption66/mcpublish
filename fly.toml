app = "mcpublish"
primary_region = "lhr"

[build]

[env]
  RAILS_LOG_TO_STDOUT = "1"
  # The container runs as a non-root user (Dockerfile: USER 1000:1000), so
  # Thruster can't bind port 80 directly (Linux reserves ports < 1024 for
  # root) — move it above 1024 and point Fly's proxy at that port instead.
  HTTP_PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks]
  [checks.up]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/up"
    port = 8080
    timeout = "5s"
    type = "http"
