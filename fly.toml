app = "mcpublish"
primary_region = "lhr"

[build]

[env]
  RAILS_LOG_TO_STDOUT = "1"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks]
  [checks.up]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/up"
    port = 80
    timeout = "5s"
    type = "http"
